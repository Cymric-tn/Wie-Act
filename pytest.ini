[pytest]
testpaths = tests
asyncio_mode = auto
markers =
    integration: needs a running provider (Ollama); run with -m integration
addopts = -m "not integration" -p no:launch_ros -p no:launch_testing -p no:ament_flake8 -p no:ament_copyright -p no:ament_xmllint -p no:ament_lint -p no:ament_pep257
# ^ ROS Humble on this machine injects pytest plugins via PYTHONPATH; they break collection.
