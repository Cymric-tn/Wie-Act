# Curated glossary, topic "derivative": learner terms -> French course terms.
# Applied deterministically to the question before BM25 (rag/glossary.py): no LLM call.
# Variants cover Tunisian Darija (Arabic letters), Arabizi (Latin letters, digits 3/7/9/5/2),
# Modern Standard Arabic and English, with common spelling variants. Matching runs on the same
# normalized tokens as BM25 (accents folded, Arabic article/diacritics stripped, ة->ه, أ->ا),
# so "المشتقة", "مشتقة" and "مُشتقّة" are one variant. A variant may appear in one entry only.
version: 1
